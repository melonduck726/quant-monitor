<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC / ETH / ZEC 多周期实时监测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e1a;
    --surface: #10162a;
    --surface-2: #151d35;
    --border: #232c47;
    --text: #e7ecf5;
    --text-dim: #8993ac;
    --btc: #f2a93b;
    --eth: #8b9bff;
    --zec: #f2c94c;
    --pos: #34d399;
    --neg: #fb7185;
    --neutral: #c9a84c;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 20% -10%, #141c36 0%, var(--bg) 45%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 22px 16px 60px;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }

  .top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:8px;}
  .top h1{ font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .top .sub{ color: var(--text-dim); font-size: 12.5px; }

  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{
    flex:1; text-align:center; padding: 11px 0; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:13px;
    color: var(--text-dim); cursor:pointer; transition: all .15s ease;
  }
  .tab.active.btc{ background: linear-gradient(180deg,#2a2010,#1a1608); border-color: var(--btc); color: var(--btc); }
  .tab.active.eth{ background: linear-gradient(180deg,#181c33,#111426); border-color: var(--eth); color: var(--eth); }
  .tab.active.zec{ background: linear-gradient(180deg,#2a2610,#1a1808); border-color: var(--zec); color: var(--zec); }

  .price-card{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding: 20px; margin-bottom: 14px;
  }
  .price-card .label{ color: var(--text-dim); font-size: 12.5px; margin-bottom: 6px; }
  .price-row{ display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .price-main{ font-family:'IBM Plex Mono', monospace; font-size: 40px; font-weight:600; line-height:1; }
  .price-change{ font-family:'IBM Plex Mono', monospace; font-size:15px; font-weight:600; padding: 4px 9px; border-radius:7px; }
  .price-change.up{ color:var(--pos); background: rgba(52,211,153,0.12); }
  .price-change.down{ color:var(--neg); background: rgba(251,113,133,0.12); }
  .updated{ color: var(--text-dim); font-size: 11.5px; margin-top:10px; font-family:'IBM Plex Mono', monospace; }

  .signal-card{
    border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
    border: 1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .signal-card.long{ background: linear-gradient(135deg, rgba(52,211,153,0.14), rgba(52,211,153,0.03)); border-color: rgba(52,211,153,0.35);}
  .signal-card.short{ background: linear-gradient(135deg, rgba(251,113,133,0.14), rgba(251,113,133,0.03)); border-color: rgba(251,113,133,0.35);}
  .signal-card.flat{ background: linear-gradient(135deg, rgba(201,168,76,0.12), rgba(201,168,76,0.02)); border-color: rgba(201,168,76,0.3);}
  .signal-card .label{ color: var(--text-dim); font-size:12.5px; margin-bottom:6px;}
  .signal-card .value{ font-size:26px; font-weight:700; }
  .signal-card .value.long{ color: var(--pos); }
  .signal-card .value.short{ color: var(--neg); }
  .signal-card .value.flat{ color: var(--neutral); }
  .signal-card .score{ font-family:'IBM Plex Mono', monospace; color: var(--text-dim); font-size:14px; text-align:right; }

  .gauge-card{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .gauge-card .label{ color: var(--text-dim); font-size:12.5px; margin-bottom: 10px;}
  .gauge-track{ height: 10px; background:#1c2440; border-radius:6px; overflow:hidden; display:flex; margin-bottom:8px; }
  .gauge-up{ background: linear-gradient(90deg,#1fae7a,var(--pos)); height:100%; }
  .gauge-down{ background: linear-gradient(90deg,var(--neg),#c94559); height:100%; }
  .gauge-labels{ display:flex; justify-content:space-between; font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .gauge-labels .u{ color: var(--pos); } .gauge-labels .d{ color: var(--neg); }

  table{ width:100%; border-collapse: collapse; font-family:'IBM Plex Mono', monospace; font-size: 12.5px; }
  .table-card{ background: var(--surface); border:1px solid var(--border); border-radius:14px; padding: 16px 14px 6px; margin-bottom:14px; overflow-x:auto;}
  .table-card .label{ font-family:'Inter',sans-serif; color: var(--text-dim); font-size:12.5px; margin-bottom:12px; padding: 0 6px;}
  th{ text-align:left; color: var(--text-dim); font-weight:500; padding: 6px 8px; border-bottom:1px solid var(--border); font-size:11.5px;}
  td{ padding: 10px 8px; border-bottom:1px solid #1a2138; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  .dir{ font-weight:600; padding: 3px 8px; border-radius:6px; font-size:11.5px; }
  .dir.long{ color: var(--pos); background: rgba(52,211,153,0.1); }
  .dir.short{ color: var(--neg); background: rgba(251,113,133,0.1); }
  .dir.flat{ color: var(--neutral); background: rgba(201,168,76,0.1); }

  .strategy-card{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; margin-bottom: 14px;
  }
  .strategy-card .label{ color: var(--text-dim); font-size:12.5px; margin-bottom: 12px; }
  .strategy-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .strategy-dir{ font-size:20px; font-weight:700; }
  .strategy-dir.long{ color: var(--pos); } .strategy-dir.short{ color: var(--neg); } .strategy-dir.flat{ color: var(--neutral); }
  .confidence{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--text-dim); border:1px solid var(--border); padding:3px 9px; border-radius:20px; }
  .strategy-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 12px; }
  .strategy-cell{ background: var(--surface-2); border:1px solid var(--border); border-radius:10px; padding: 10px 8px; text-align:center; }
  .strategy-cell .k{ color: var(--text-dim); font-size:11px; margin-bottom:4px; }
  .strategy-cell .v{ font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600; }
  .strategy-cell .v.entry{ color: var(--text); }
  .strategy-cell .v.stop{ color: var(--neg); }
  .strategy-cell .v.target{ color: var(--pos); }
  .strategy-note{ color: var(--text-dim); font-size:12px; line-height:1.7; }

  .news-card{
    background: var(--surface); border:1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .news-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 12px; }
  .news-head .label{ color: var(--text-dim); font-size:12.5px; }
  .news-head .src{ color: var(--text-dim); font-size:11px; font-family:'IBM Plex Mono', monospace; }
  .news-item{ padding: 10px 0; border-bottom: 1px solid #1a2138; }
  .news-item:last-child{ border-bottom:none; padding-bottom:0; }
  .news-item a{ color: var(--text); text-decoration:none; font-size:13px; line-height:1.5; display:block; }
  .news-item a:hover{ color: var(--eth); }
  .news-meta{ display:flex; align-items:center; gap:8px; margin-top:6px; }
  .tag{ font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; }
  .tag.pos{ color: var(--pos); background: rgba(52,211,153,0.1); }
  .tag.neg{ color: var(--neg); background: rgba(251,113,133,0.1); }
  .tag.neu{ color: var(--text-dim); background: rgba(137,147,172,0.1); }
  .news-time{ color: var(--text-dim); font-size:11px; font-family:'IBM Plex Mono', monospace; }
  .news-empty{ color: var(--text-dim); font-size:12.5px; padding: 6px 0; }

  .footnote{ color: var(--text-dim); font-size: 11.5px; line-height:1.6; padding: 4px 6px 0; }
  .err{ color: var(--neg); font-size:13px; padding: 14px; background: rgba(251,113,133,0.08); border:1px solid rgba(251,113,133,0.3); border-radius:10px; margin-bottom:14px; }
  .refresh-row{ display:flex; align-items:center; justify-content:space-between; margin: 4px 2px 16px; }
  .refresh-btn{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color: var(--text);
    background: var(--surface-2); border:1px solid var(--border); border-radius:9px;
    padding: 9px 16px; cursor:pointer;
  }
  .refresh-btn:active{ transform: scale(0.97); }
  .countdown{ color: var(--text-dim); font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .loading{ text-align:center; color: var(--text-dim); padding: 30px 0; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>多周期实时监测</h1>
    <div class="sub">数据源 · OKX 永续行情</div>
  </div>

  <div class="tabs">
    <div class="tab active btc" data-inst="BTC-USDT-SWAP" data-name="BTC" id="tabBTC">BTC</div>
    <div class="tab eth" data-inst="ETH-USDT-SWAP" data-name="ETH" id="tabETH">ETH</div>
    <div class="tab zec" data-inst="ZEC-USDT-SWAP" data-name="ZEC" id="tabZEC">ZEC</div>
  </div>

  <div class="refresh-row">
    <button class="refresh-btn" id="refreshBtn">立即刷新</button>
    <div class="countdown" id="countdown">下次刷新 30s</div>
  </div>

  <div id="content">
    <div class="loading">正在加载行情数据…</div>
  </div>

  <div class="news-card">
    <div class="news-head">
      <div class="label">消息面快报</div>
      <div class="src" id="newsSrc">来源 · Cointelegraph / CoinDesk</div>
    </div>
    <div id="newsList"><div class="news-empty">正在加载资讯…</div></div>
  </div>

  <div class="footnote">
    指标由 15m / 1H / 4H K线实时计算，45m 由 15m 聚合得出（EMA20/EMA60/RSI14/MACD 柱/ATR14）。策略参考价基于 ATR 波动率测算，仅为技术指标概率倾向，不构成投资建议，不保证价格方向，请自行控制仓位与风险。消息面标签为关键词粗略情绪判断，非专业情绪分析。
  </div>
</div>

<script>
const state = { inst: 'BTC-USDT-SWAP', name: 'BTC', accent: 'btc', timer: null, countdown: 30 };
const OKX_BASE = 'https://www.okx.com';

function emaSeries(values, period){
  const k = 2/(period+1);
  const out = [values[0]];
  for(let i=1;i<values.length;i++){
    out.push(values[i]*k + out[i-1]*(1-k));
  }
  return out;
}

function lastRSI(closes, period=14){
  if(closes.length < period+1) return 50;
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    const d = closes[i]-closes[i-1];
    if(d>=0) gains+=d; else losses-=d;
  }
  let avgGain = gains/period, avgLoss = losses/period;
  for(let i=period+1;i<closes.length;i++){
    const d = closes[i]-closes[i-1];
    const g = d>0?d:0, l = d<0?-d:0;
    avgGain = (avgGain*(period-1)+g)/period;
    avgLoss = (avgLoss*(period-1)+l)/period;
  }
  if(avgLoss === 0) return 100;
  const rs = avgGain/avgLoss;
  return 100 - 100/(1+rs);
}

function lastMACDHist(closes){
  if(closes.length < 35) return 0;
  const e12 = emaSeries(closes, 12);
  const e26 = emaSeries(closes, 26);
  const macdLine = closes.map((_,i)=> e12[i]-e26[i]);
  const signal = emaSeries(macdLine, 9);
  return macdLine[macdLine.length-1] - signal[signal.length-1];
}

function lastATR(candles, period=14){
  if(candles.length < period+1) return 0;
  const trs = [];
  for(let i=1;i<candles.length;i++){
    const c = candles[i], p = candles[i-1];
    trs.push(Math.max(c.high-c.low, Math.abs(c.high-p.close), Math.abs(c.low-p.close)));
  }
  const last = trs.slice(-period);
  return last.reduce((a,b)=>a+b,0)/last.length;
}

function computeMetrics(candles){
  const closes = candles.map(c=>c.close);
  const e20 = emaSeries(closes,20);
  const e60 = emaSeries(closes,60);
  return {
    ema20: e20[e20.length-1],
    ema60: e60[e60.length-1],
    rsi: lastRSI(closes,14),
    macd: lastMACDHist(closes),
    atr: lastATR(candles,14),
    close: closes[closes.length-1]
  };
}

function direction(m){
  if(m.ema20 > m.ema60 && m.rsi >= 50 && m.macd > 0) return 'long';
  if(m.ema20 < m.ema60 && m.rsi < 50 && m.macd < 0) return 'short';
  return 'flat';
}
function dirLabel(d){ return d==='long' ? '偏多' : d==='short' ? '偏空' : '震荡'; }

async function fetchCandles(instId, bar, limit){
  const url = `${OKX_BASE}/api/v5/market/candles?instId=${instId}&bar=${bar}&limit=${limit}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('candles request failed');
  const json = await res.json();
  if(json.code !== '0') throw new Error(json.msg || 'candles error');
  // OKX returns newest-first: [ts,o,h,l,c,vol,volCcy,volCcyQuote,confirm]
  return json.data.reverse().map(d => ({
    time: +d[0], open: +d[1], high: +d[2], low: +d[3], close: +d[4]
  }));
}

async function fetchTicker(instId){
  const res = await fetch(`${OKX_BASE}/api/v5/market/ticker?instId=${instId}`);
  if(!res.ok) throw new Error('ticker request failed');
  const json = await res.json();
  if(json.code !== '0') throw new Error(json.msg || 'ticker error');
  return json.data[0];
}

function aggregate(candles, groupSize){
  const out = [];
  for(let i=0;i+groupSize<=candles.length;i+=groupSize){
    const group = candles.slice(i, i+groupSize);
    out.push({
      time: group[0].time,
      open: group[0].open,
      close: group[group.length-1].close,
      high: Math.max(...group.map(c=>c.high)),
      low: Math.min(...group.map(c=>c.low)),
    });
  }
  return out;
}

function decimals(name){ return name==='BTC' ? 1 : name==='ETH' ? 2 : 3; }
function fmt(n, d){ return Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d}); }

function buildStrategy(overall, score, price, atr15, name){
  const d = decimals(name);
  if(overall === 'flat'){
    return {
      dir: 'flat', dirLabel: '观望',
      confidence: '弱',
      entry: '—', stop: '—', target: '—',
      note: '当前多周期信号不一致，未形成有效共振，建议等待方向明朗后再考虑入场。'
    };
  }
  const confidence = Math.abs(score) >= 3 ? '强' : '中';
  if(overall === 'long'){
    const stop = price - 1.2*atr15;
    const target = price + 2.4*atr15;
    return {
      dir: 'long', dirLabel: '做多参考',
      confidence,
      entry: fmt(price,d), stop: fmt(stop,d), target: fmt(target,d),
      note: `止损参考 1.2×ATR14，止盈参考 2.4×ATR14（风险回报约 1:2）。多周期共振偏多 ${score}/4，信号强度：${confidence}。`
    };
  }
  const stop = price + 1.2*atr15;
  const target = price - 2.4*atr15;
  return {
    dir: 'short', dirLabel: '做空参考',
    confidence,
    entry: fmt(price,d), stop: fmt(stop,d), target: fmt(target,d),
    note: `止损参考 1.2×ATR14，止盈参考 2.4×ATR14（风险回报约 1:2）。多周期共振偏空 ${score}/4，信号强度：${confidence}。`
  };
}

async function loadData(){
  const content = document.getElementById('content');
  const name = state.name;
  try{
    const [ticker, k15, k1h, k4h] = await Promise.all([
      fetchTicker(state.inst),
      fetchCandles(state.inst, '15m', 260),
      fetchCandles(state.inst, '1H', 100),
      fetchCandles(state.inst, '4H', 100),
    ]);
    const k45 = aggregate(k15, 3);

    const periods = [
      { label: '15m', candles: k15 },
      { label: '45m', candles: k45 },
      { label: '1H',  candles: k1h },
      { label: '4H',  candles: k4h },
    ].map(p => {
      const m = computeMetrics(p.candles);
      const d = direction(m);
      return { ...p, m, d };
    });

    const score = periods.reduce((s,p)=> s + (p.d==='long'?1:p.d==='short'?-1:0), 0);
    let overall = 'flat', overallLabel = '观望';
    if(score >= 2){ overall='long'; overallLabel='做多'; }
    else if(score <= -2){ overall='short'; overallLabel='做空'; }

    const rsi15 = periods[0].m.rsi;
    let up = 50 + (rsi15-50)*0.35 + score*4;
    up = Math.max(8, Math.min(92, up));
    const down = 100 - up;

    const last = parseFloat(ticker.last);
    const open24h = parseFloat(ticker.open24h);
    const change = open24h ? ((last-open24h)/open24h*100) : 0;
    const changeCls = change >= 0 ? 'up' : 'down';
    const changeSign = change >= 0 ? '+' : '';
    const d = decimals(name);

    const strategy = buildStrategy(overall, score, last, periods[0].m.atr, name);

    const now = new Date();
    const timeStr = now.toLocaleTimeString('zh-CN', {hour12:false});

    content.innerHTML = `
      <div class="price-card">
        <div class="label">${name} / USDT 最新价 · 永续</div>
        <div class="price-row">
          <div class="price-main">${fmt(last, d)}</div>
          <div class="price-change ${changeCls}">${changeSign}${change.toFixed(2)}% 24h</div>
        </div>
        <div class="updated">更新于 ${timeStr}</div>
      </div>

      <div class="signal-card ${overall}">
        <div>
          <div class="label">多周期综合</div>
          <div class="value ${overall}">${overallLabel}</div>
        </div>
        <div class="score">${score >= 0 ? '+'+score : score} / 4</div>
      </div>

      <div class="gauge-card">
        <div class="label">下一个 15 分钟倾向</div>
        <div class="gauge-track">
          <div class="gauge-up" style="width:${up}%"></div>
          <div class="gauge-down" style="width:${down}%"></div>
        </div>
        <div class="gauge-labels">
          <span class="u">上涨倾向 ${up.toFixed(0)}%</span>
          <span class="d">下跌倾向 ${down.toFixed(0)}%</span>
        </div>
      </div>

      <div class="strategy-card">
        <div class="label">实时策略</div>
        <div class="strategy-head">
          <div class="strategy-dir ${strategy.dir}">${strategy.dirLabel}</div>
          <div class="confidence">信号强度 · ${strategy.confidence}</div>
        </div>
        <div class="strategy-grid">
          <div class="strategy-cell"><div class="k">入场参考</div><div class="v entry">${strategy.entry}</div></div>
          <div class="strategy-cell"><div class="k">止损参考</div><div class="v stop">${strategy.stop}</div></div>
          <div class="strategy-cell"><div class="k">止盈参考</div><div class="v target">${strategy.target}</div></div>
        </div>
        <div class="strategy-note">${strategy.note}</div>
      </div>

      <div class="table-card">
        <div class="label">多周期指标 · 45m 由 15m 聚合计算</div>
        <table>
          <thead><tr>
            <th>周期</th><th>EMA20</th><th>EMA60</th><th>RSI14</th><th>MACD</th><th>ATR14</th><th>方向</th>
          </tr></thead>
          <tbody>
            ${periods.map(p => `
              <tr>
                <td>${p.label}</td>
                <td>${fmt(p.m.ema20, d)}</td>
                <td>${fmt(p.m.ema60, d)}</td>
                <td>${p.m.rsi.toFixed(1)}</td>
                <td>${p.m.macd.toFixed(3)}</td>
                <td>${p.m.atr.toFixed(3)}</td>
                <td><span class="dir ${p.d}">${dirLabel(p.d)}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch(err){
    content.innerHTML = `<div class="err">行情数据加载失败：${err.message}。稍后会自动重试，也可点击"立即刷新"。</div>`;
  }
}

const NEWS_FEEDS = [
  { url: 'https://cointelegraph.com/rss', name: 'Cointelegraph' },
  { url: 'https://www.coindesk.com/arc/outboundfeeds/rss/', name: 'CoinDesk' },
];
const POS_WORDS = ['surge','rally','soar','bullish','approve','approval','record high','all-time high','adoption','inflow','breakout','upgrade','gain','jump','rebound'];
const NEG_WORDS = ['crash','plunge','hack','exploit','ban','lawsuit','sell-off','selloff','bearish','fraud','collapse','outflow','fine','crackdown','liquidat','drop','fall','warn'];

function classifyHeadline(title){
  const t = title.toLowerCase();
  const pos = POS_WORDS.some(w => t.includes(w));
  const neg = NEG_WORDS.some(w => t.includes(w));
  if(pos && !neg) return 'pos';
  if(neg && !pos) return 'neg';
  return 'neu';
}
function tagLabel(c){ return c==='pos' ? '利多' : c==='neg' ? '利空' : '中性'; }

function timeAgo(dateStr){
  const diffMin = Math.max(0, Math.round((Date.now() - new Date(dateStr).getTime())/60000));
  if(diffMin < 60) return `${diffMin}分钟前`;
  const h = Math.round(diffMin/60);
  if(h < 24) return `${h}小时前`;
  return `${Math.round(h/24)}天前`;
}

async function loadNews(){
  const listEl = document.getElementById('newsList');
  try{
    const results = await Promise.allSettled(NEWS_FEEDS.map(f =>
      fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}&count=6`)
        .then(r => r.json())
        .then(json => (json.items||[]).map(it => ({
          title: it.title, link: it.link, pubDate: it.pubDate, source: f.name
        })))
    ));
    let items = [];
    results.forEach(r => { if(r.status === 'fulfilled') items = items.concat(r.value); });
    if(items.length === 0){
      listEl.innerHTML = '<div class="news-empty">暂时获取不到资讯，稍后自动重试。</div>';
      return;
    }
    items.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
    items = items.slice(0, 8);
    listEl.innerHTML = items.map(it => {
      const cls = classifyHeadline(it.title);
      return `
        <div class="news-item">
          <a href="${it.link}" target="_blank" rel="noopener">${it.title}</a>
          <div class="news-meta">
            <span class="tag ${cls}">${tagLabel(cls)}</span>
            <span class="news-time">${it.source} · ${timeAgo(it.pubDate)}</span>
          </div>
        </div>
      `;
    }).join('');
  } catch(err){
    listEl.innerHTML = '<div class="news-empty">资讯加载失败，稍后自动重试。</div>';
  }
}

function resetCountdown(){
  state.countdown = 30;
  document.getElementById('countdown').textContent = `下次刷新 ${state.countdown}s`;
}

function startTimer(){
  if(state.timer) clearInterval(state.timer);
  resetCountdown();
  state.timer = setInterval(()=>{
    state.countdown -= 1;
    if(state.countdown <= 0){
      loadData();
      resetCountdown();
    } else {
      document.getElementById('countdown').textContent = `下次刷新 ${state.countdown}s`;
    }
  }, 1000);
}

function switchTab(inst, name, accent){
  state.inst = inst; state.name = name; state.accent = accent;
  document.getElementById('tabBTC').classList.toggle('active', inst==='BTC-USDT-SWAP');
  document.getElementById('tabETH').classList.toggle('active', inst==='ETH-USDT-SWAP');
  document.getElementById('tabZEC').classList.toggle('active', inst==='ZEC-USDT-SWAP');
  document.getElementById('content').innerHTML = '<div class="loading">正在加载行情数据…</div>';
  loadData();
  startTimer();
}

document.getElementById('tabBTC').addEventListener('click', ()=> switchTab('BTC-USDT-SWAP','BTC','btc'));
document.getElementById('tabETH').addEventListener('click', ()=> switchTab('ETH-USDT-SWAP','ETH','eth'));
document.getElementById('tabZEC').addEventListener('click', ()=> switchTab('ZEC-USDT-SWAP','ZEC','zec'));
document.getElementById('refreshBtn').addEventListener('click', ()=>{ loadData(); loadNews(); resetCountdown(); });

loadData();
loadNews();
startTimer();
setInterval(loadNews, 5 * 60 * 1000);
</script>
